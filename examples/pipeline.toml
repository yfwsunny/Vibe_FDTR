name = "example_full"
convergence_tol = 0.0001  # relative-change threshold for early stop

# ---------------------------------------------------------------
# Pipeline for iterative fitting.
# Each [[step]] is one fitting sub-operation. Steps run in order;
# the whole pipeline repeats for config.iterations (or until
# convergence_tol is satisfied).
#
# Step-level overrides (optional, fallback to config when absent):
#   freq_ranges   — list of [lo, hi] in Hz   (freq steps)
#   offset_ranges — list of [lo, hi] in um    (offset steps; fwhm ignores this)
#   freq_offset   — Hz                        (offset steps only)
# ---------------------------------------------------------------

[[step]]  # fit beam spot size via FWHM of offset scan
name = "spot_x"                  # human-readable step label
fitter = "fwhm"                  # "fwhm" | "freq" | "offset"
data_key = "offset_x_amplitude"  # key in loaded datasets
target_names = ["spot_x"]        # model parameters to fit

[[step]]  # fit beam spot size via FWHM of offset scan (Y direction)
name = "spot_y"
fitter = "fwhm"
data_key = "offset_y_amplitude"
target_names = ["spot_y"]

[[step]]  # fit in-plane conductivity from beam-offset scan
name = "sr"
fitter = "offset"
signal = "phase"                 # required for freq/offset; "phase" | "amplitude"
data_key = "offset_x_phase"
target_names = ["Sr_2"]          # use S_2 if layer is isotropic
spot_key = "spot_x"              # "spot_x" | "spot_y" | "spot_size" (default)
# freq_offset = 2.0e6           # Hz, overrides config.freq_offset
# offset_ranges = [[-10.0, 10.0]]  # um, overrides config.offset_ranges

[[step]]  # fit cross-plane conductivity + TBC from frequency sweep
name = "sz_tbc"
fitter = "freq"
signal = "phase"
data_key = "freq_phase"
target_names = ["Sz_2", "TBC_1"]
spot_key = "spot_size"
# freq_ranges = [[1.0e6, 5.0e6], [1.0e7, 5.0e7]]  # Hz, overrides config.freq_ranges
